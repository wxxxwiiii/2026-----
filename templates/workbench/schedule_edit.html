{% extends 'base.html' %}
{% block title %}编辑课表{% endblock %}
{% block page_title %}编辑课表{% endblock %}
{% block content %}
<div class="card">
  <form method="post">
    <div class="form-grid">
      <label>课程名称 <input type="text" name="course_name" value="{{ s.course_name }}" required></label>
      <label>星期
        <select name="day_of_week">{% for i in range(7) %}<option value="{{ i }}" {{ 'selected' if s.day_of_week == i }}>{{ days[i] }}</option>{% endfor %}</select>
      </label>
      <label>开始时间 <input type="text" name="start_time" value="{{ s.start_time or '' }}"></label>
      <label>结束时间 <input type="text" name="end_time" value="{{ s.end_time or '' }}"></label>
      <label>上课地点 <input type="text" name="location" value="{{ s.location or '' }}"></label>
      <label>授课班级
        <select name="class_id"><option value="">（未指定）</option>{% for c in classes %}<option value="{{ c.id }}" {{ 'selected' if s.class_id == c.id }}>{{ c.name }}</option>{% endfor %}</select>
      </label>
    </div>
    <label>备注 <input type="text" name="note" value="{{ s.note or '' }}"></label>
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="{{ url_for('workbench.schedule') }}" class="btn">取消</a>
  </form>
</div>
{% endblock %}
